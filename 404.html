<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | Dilshad Designs</title>
  <link rel="icon" href="assets/photo/favicon-round.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    .page-404 {
      min-height: 100vh; display: flex;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      background: var(--bg);
    }
    .err-number {
      font-family: 'Syne', sans-serif;
      font-size: clamp(6rem, 20vw, 12rem);
      font-weight: 800; line-height: 1;
      color: #ff4d4f; opacity: 0.12;
      position: absolute;
      left: 50%; transform: translateX(-50%);
      user-select: none; white-space: nowrap;
    }
    .err-content { position: relative; z-index: 1; }
    .err-content img { width: 80px; border-radius: 50%; border: 2px solid var(--gold); margin: 0 auto 1.5rem; }
    .err-content h1 { font-size: clamp(1.5rem, 4vw, 2.2rem); font-weight: 800; margin-bottom: 0.75rem; }
    .err-content p  { color: var(--text-muted); font-size: 1rem; max-width: 400px; margin: 0 auto 2rem; }
    .err-links { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="page-404">
    <div class="err-number">404</div>
    <div class="err-content">
      <img src="assets/photo/logo-png.png" alt="Dilshad Designs">
      <h1>Page Not Found</h1>
      <p>Looks like this page took a design break. Let's get you back on track.</p>
      <div class="err-links">
        <a href="index.html" class="btn-primary"><i class="fas fa-home"></i> Go Home</a>
        <a href="projects.html" class="btn-outline" style="color:var(--text);border-color:var(--border)"><i class="fas fa-images"></i> View Work</a>
        <a href="contact.html" class="btn-gold"><i class="fas fa-paper-plane"></i> Contact Me</a>
      </div>
    </div>
  </div>
</body>
</html>
